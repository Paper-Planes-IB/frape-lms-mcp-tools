[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "frappe-lms-mcp"
version = "1.0.0"
description = "MCP server for managing Frappe LMS courses, chapters, lessons, quizzes, and enrollments via AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "LMS Admin Tools" }]
keywords = ["frappe", "lms", "mcp", "ai", "course-creation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Developers",
    "Topic :: Education",
]
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
frappe-lms-mcp = "frappe_lms_mcp.server:main"
frappe-lms-dashboard = "frappe_lms_mcp.dashboard_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"frappe_lms_mcp" = ["py.typed", "templates/*.html"]
